<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Trevo - frame</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', 'Noto Color Emoji', sans-serif; }
  #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
  #shade { position: absolute; left: 0; right: 0; bottom: 0; height: 760px;
           background: linear-gradient(to top, rgba(8,14,28,.55), rgba(8,14,28,0)); pointer-events: none; }
  #cap { position: absolute; left: 0; right: 0; top: 1200px; text-align: center; white-space: nowrap;
         font-weight: 900; font-size: 136px; line-height: 1; color: #fff; letter-spacing: -2px;
         -webkit-text-stroke: 16px #0b0f1a; paint-order: stroke fill;
         text-shadow: 0 10px 0 rgba(0,0,0,.30); will-change: transform; }
  #tag { position: absolute; left: 0; right: 0; top: 520px; text-align: center; white-space: nowrap;
         font-weight: 900; font-size: 92px; line-height: 1; color: #ffd21f; letter-spacing: -1px;
         -webkit-text-stroke: 14px #1a1200; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.35); }
  #xmark { position: absolute; left: 340px; top: 640px; width: 400px; height: 400px; opacity: 0; filter: drop-shadow(0 10px 0 rgba(0,0,0,.35)); }
  #end { position: absolute; left: 0; right: 0; top: 1130px; text-align: center; opacity: 0; }
  #end .pill { display: inline-block; padding: 34px 64px 38px; border-radius: 80px; background: #ffd21f; color: #161200;
               font-weight: 900; font-size: 100px; line-height: 1.02; letter-spacing: -2px; border: 12px solid #161200;
               box-shadow: 0 14px 0 rgba(0,0,0,.4); }
  #end .pill small { display: block; font-size: 64px; letter-spacing: -1px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="shade"></div>
  <svg id="xmark" viewBox="0 0 100 100"><path d="M16 16 L84 84 M84 16 L16 84" stroke="#ff2d2d" stroke-width="20" stroke-linecap="round" fill="none"/><path d="M16 16 L84 84 M84 16 L16 84" stroke="#ff7b7b" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
  <div id="tag"></div>
  <div id="cap"></div>
  <div id="end"><div class="pill">SEGUE PRA MAIS<small>curiosidades 🚦</small></div></div>
</div>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
